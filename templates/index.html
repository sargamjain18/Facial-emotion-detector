<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Emotion Detector | Live AI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0f2027;
        color: #ffffff;
        font-family: "Poppins", sans-serif;
        text-align: center;
        padding-top: 50px;
      }
      h1 {
        font-size: 48px;
        margin-bottom: 30px;
        color: #00ffc3;
        text-shadow: 0 0 10px #00ffc3;
      }
      .video-container {
        border: 5px solid;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0px 0px 30px rgba(0, 255, 200, 0.3);
        display: inline-block;
      }
      img {
        width: 800px;
        height: 600px;
        border-radius: 15px;
      }
      .btn-custom {
        background-color: #00ffc3;
        color: #000;
        font-weight: bold;
        padding: 10px 30px;
        border-radius: 30px;
        margin-top: 20px;
        text-decoration: none;
      }
      .btn-custom:hover {
        background-color: #00bfa6;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Facial Emotion AI Detector</h1>

    <div class="video-container">
      <img src="{{ url_for('video') }}" alt="Emotion Detector" />
    </div>

    <!-- Button to go to /questions -->
    <br />
    <a href="{{ url_for('questions') }}" class="btn btn-custom"
      >Take Assessment</a
    >
  </body>
</html>
