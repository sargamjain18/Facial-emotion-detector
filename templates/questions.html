<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mental Health Questions</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f2f2f2;
        font-family: "Poppins", sans-serif;
        padding: 40px;
      }
      .question-box {
        background-color: white;
        border-radius: 10px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        margin-bottom: 30px;
      }
      .form-check-label {
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <h2>
      Mental Health Questionnaire<br />
      (Detected Emotion: <strong>{{ emotion }}</strong>)
    </h2>

    <form method="post" action="{{ url_for('submit') }}">
      {% for q in questions %}
      <div class="question-box">
        <p><strong>{{ loop.index }}. {{ q[0] }}</strong></p>

        {% set group_name = 'q' ~ loop.index0 %} {% for opt in q[1] %}
        <div class="form-check">
          <input
            class="form-check-input"
            type="radio"
            name="{{ group_name }}"
            value="{{ opt }}"
            required
          />
          <label class="form-check-label">{{ opt }}</label>
        </div>
        {% endfor %}
      </div>
      {% endfor %}

      <div style="text-align: center">
        <button type="submit" class="btn btn-success px-5 py-2">Submit</button>
      </div>
    </form>
  </body>
</html>
